<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma inteligente para gestión de soporte técnico</title>
    <link rel="stylesheet" href="ChatDisenio.css">
</head>
<body>
    <div class="main-layout"> <!--pantalla completa-->
        <!-- Barra Lateral de Navegación -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <nav class="nav-menu">
                    <!--Boton de inicio-->   
                    <a href="#" class="nav-link">
                        <img width="30" height="30" src="Iconos/HomeNegro.png" alt="Inicio" class="custom-icon">
                        Inicio
                    </a>
                    <!--Boton de Soporte (Activo)-->   
                    <a href="#" class="nav-link active">
                        <img width="30" height="30" src="Iconos/soporte blanco.png" alt="Usuario" class="custom-icon">
                        Soporte
                    </a>
                    <!--Boton de Dashboard-->   
                    <a href="#" class="nav-link">
                        <img width="30" height="30" src="Iconos/barras.png" alt="Dashboard" class="custom-icon">
                        Dashboard
                    </a>
                    <!--Boton de Ajustes-->   
                    <a href="#" class="nav-link">
                        <img width="30" height="30" src="Iconos/ajustes.png" alt="Ajustes" class="custom-icon">
                        Ajustes
                    </a>
                </nav>
            </div>
            
            <!-- Perfil de usuario en la parte inferior de la barra lateral -->
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar-container">
                        <img src="Iconos/usuariGris.png" alt="Usuario" class="user-avatar-icon">
                    </div>
                    <span class="user-name">Usuario</span>
                </div>
            </div>
        </aside>

        <!-- Contenido Principal / Interfaz de Chat Funcional -->
        <main class="content">
            <div class="chat-container">
                <!-- Contenedor donde se cargarán dinámicamente los mensajes -->
                <div class="chat-messages" id="chat-messages">
                    <!-- Mensaje inicial de bienvenida de la IA -->
                    <div class="message ai-message">
                        <div class="message-bubble">
                            <div class="ai-header">
                                <span class="ai-icon">✨</span> 
                                <span>IA Soporte:</span>
                            </div>
                            <div class="ai-body">
                                <p>Hola. ¿Tienes problemas con tu dispositivo? Cuéntame qué sucede y te ayudaré a resolverlo.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Barra de entrada de chat interactiva -->
                <div class="chat-input-container">
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="Escribe tu respuesta o describe el problema...." autocomplete="off">
                        <button type="button" id="send-btn" class="send-icon-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="ChatApp.js"></script>
</body>
</html>
