<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Plataforma Inteligente de Soporte Técnico</title>
    <link rel="stylesheet" href="homedisenio.css">
    <link rel="stylesheet" href="portal.css">
</head>
<body>
    <div class="main-layout">
        <aside class="sidebar">
            <div class="sidebar-top">
                <nav class="nav-menu">
                    <div class="nav-indicator"></div>
                    <a href="dashboardVentana.html" class="nav-link" data-nav="inicio">
                        <img width="30" height="30" src="Iconos/HomeNegro.png" alt="Inicio" class="custom-icon">
                        Inicio
                    </a>
                    <a href="VenSolicitud.html" class="nav-link" data-nav="soporte">
                        <img width="30" height="30" src="Iconos/soporte blanco.png" alt="Soporte" class="custom-icon">
                        Soporte
                    </a>
                    <a href="dashboardVentana.html" class="nav-link active" data-nav="dashboard">
                        <img width="30" height="30" src="Iconos/barras.png" alt="Dashboard" class="custom-icon">
                        Dashboard
                    </a>
                    <a href="#" class="nav-link" title="Próximamente">
                        <img width="30" height="30" src="Iconos/ajustes.png" alt="Ajustes" class="custom-icon">
                        Ajustes
                    </a>
                </nav>
            </div>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar-container">
                        <img src="Iconos/usuariGris.png" alt="Usuario" class="user-avatar-icon">
                    </div>
                    <span class="user-name" id="sidebar-user-name">Usuario</span>
                </div>
            </div>
        </aside>

        <main class="content">
            <div class="home-container">
                <section class="panel">
                    <div class="barra-filtros">
                        <h2 style="margin: 0 auto 0 0;">Indicadores</h2>
                        <label>Desde <input type="date" id="f-desde" class="campo"></label>
                        <label>Hasta <input type="date" id="f-hasta" class="campo"></label>
                        <button type="button" class="btn" id="btn-filtrar">Aplicar</button>
                    </div>
                    <div class="stats-container metricas" id="metricas"></div>
                    <p class="card-description" id="metricas-fecha"></p>
                </section>

                <p id="dash-aviso" class="aviso" hidden></p>

                <div class="dos-columnas">
                    <section class="panel">
                        <div class="barra-filtros">
                            <h2 style="margin: 0 auto 0 0;">Tickets</h2>
                            <label>Estado
                                <select id="f-estado" class="campo">
                                    <option value="">Todos</option>
                                    <option>Pendiente de asignación</option>
                                    <option>Escalado nivel 2</option>
                                    <option>Escalamiento pendiente</option>
                                    <option>Agendado</option>
                                    <option>En diagnóstico</option>
                                    <option>Pendiente</option>
                                    <option>Resuelto IA</option>
                                    <option>Cerrado</option>
                                </select>
                            </label>
                        </div>
                        <div class="tabla-wrap">
                            <table class="tabla">
                                <thead>
                                    <tr><th>#</th><th>Cliente</th><th>Problema</th><th>Estado</th><th>Técnico</th></tr>
                                </thead>
                                <tbody id="tabla-admin">
                                    <tr><td colspan="5" class="vacio">Cargando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </section>

                    <section class="panel">
                        <h2>Detalle</h2>
                        <p class="card-description" id="detalle-vacio">Selecciona un ticket.</p>
                        <div id="detalle-contenido" hidden></div>

                        <form id="form-asignar" class="formulario-columna" hidden>
                            <h3>Asignar técnico y agendar visita</h3>
                            <label>Técnico
                                <select id="asig-tecnico" class="campo" required></select>
                            </label>
                            <label>Fecha y hora (hora Colombia)
                                <input type="datetime-local" id="asig-fecha" class="campo" required>
                            </label>
                            <button type="submit" class="btn" id="btn-asignar">Asignar</button>
                        </form>
                    </section>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
    <script src="dashboardApp.js"></script>
</body>
</html>
