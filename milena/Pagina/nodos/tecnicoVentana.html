<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis visitas - Plataforma Inteligente de Soporte Técnico</title>
    <link rel="stylesheet" href="homedisenio.css">
    <link rel="stylesheet" href="portal.css">
</head>
<body>
    <div class="main-layout">
        <aside class="sidebar">
            <div class="sidebar-top">
                <nav class="nav-menu">
                    <div class="nav-indicator"></div>
                    <a href="tecnicoVentana.html" class="nav-link" data-nav="inicio">
                        <img width="30" height="30" src="Iconos/HomeNegro.png" alt="Inicio" class="custom-icon">
                        Inicio
                    </a>
                    <a href="VenSolicitud.html" class="nav-link" data-nav="soporte">
                        <img width="30" height="30" src="Iconos/soporte blanco.png" alt="Soporte" class="custom-icon">
                        Soporte
                    </a>
                    <a href="tecnicoVentana.html" class="nav-link active" data-nav="dashboard">
                        <img width="30" height="30" src="Iconos/barras.png" alt="Dashboard" class="custom-icon">
                        Dashboard
                    </a>
                    <a href="#" class="nav-link" title="Próximamente">
                        <img width="30" height="30" src="Iconos/ajustes.png" alt="Ajustes" class="custom-icon">
                        Ajustes
                    </a>
                </nav>
            </div>
            <div class="sidebar-footer">
                <div class="user-profile">
                    <div class="user-avatar-container">
                        <img src="Iconos/usuariGris.png" alt="Usuario" class="user-avatar-icon">
                    </div>
                    <span class="user-name" id="sidebar-user-name">Usuario</span>
                </div>
            </div>
        </aside>

        <main class="content">
            <div class="home-container">
                <section class="welcome-banner">
                    <div>
                        <h1>Hola, <span id="tec-nombre">técnico</span> 🛠️</h1>
                        <p>Tus visitas asignadas. Al terminar cada servicio, adjunta el acta en PDF y cierra el ticket.</p>
                    </div>
                    <button type="button" class="btn-primary-action" id="btn-recargar">Actualizar</button>
                </section>

                <p id="tec-aviso" class="aviso" hidden></p>

                <div class="dos-columnas">
                    <section class="panel">
                        <h2>Visitas pendientes</h2>
                        <div class="tabla-wrap">
                            <table class="tabla">
                                <thead>
                                    <tr><th>#</th><th>Visita</th><th>Cliente</th><th>Dirección</th><th>Estado</th></tr>
                                </thead>
                                <tbody id="tabla-cola">
                                    <tr><td colspan="5" class="vacio">Cargando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </section>

                    <section class="panel">
                        <h2>Detalle y cierre</h2>
                        <p class="card-description" id="detalle-vacio">Selecciona una visita.</p>
                        <div id="detalle-contenido" hidden></div>

                        <form id="form-cierre" class="formulario-columna" hidden>
                            <h3>Cerrar ticket</h3>
                            <label>Resultado del servicio
                                <textarea id="cierre-resultado" class="campo" rows="3" minlength="5" required placeholder="Ej: Se reemplazó el teclado y se probó el equipo."></textarea>
                            </label>
                            <label>Acta del servicio (PDF, máx. 10 MB)
                                <input type="file" id="cierre-acta" class="campo" accept="application/pdf,.pdf" required>
                            </label>
                            <button type="submit" class="btn" id="btn-cerrar">Subir acta y cerrar</button>
                        </form>
                    </section>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
    <script src="tecnicoApp.js"></script>
</body>
</html>
